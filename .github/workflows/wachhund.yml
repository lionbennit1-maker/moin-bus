name: Wachhund

on:
  schedule:
    - cron: "*/15 * * * *"   # alle 15 Minuten (GitHub kann mal ein paar Minuten trödeln)
  workflow_dispatch:          # zum Testen per Knopfdruck

permissions:
  contents: write

concurrency:
  group: wachhund
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Busse und Wetter checken
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: node wachhund/check.mjs
      - name: Gemerkte Meldungen speichern
        run: |
          if [ -n "$(git status --porcelain wachhund/state.json)" ]; then
            git config user.name "wachhund-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add wachhund/state.json
            git commit -m "Wachhund: Meldungen gemerkt [skip ci]"
            git push
          fi
